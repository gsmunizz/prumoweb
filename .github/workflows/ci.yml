name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: prumo
          # Banco descartável do CI, sem senha.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prumo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: prumo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Último patch do 1.25, para o govulncheck não acusar a biblioteca padrão.
          go-version: "1.25.x"
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Código gerado pelo sqlc está atualizado
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.30.0"
      - run: sqlc diff

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: api
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Papéis e migrações no Postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f db/bootstrap.sql
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          migrate -path db/migrations -database "postgres://prumo_owner@localhost:5432/prumo?sslmode=disable" up
          # A migração precisa voltar e subir de novo sem erro.
          migrate -path db/migrations -database "postgres://prumo_owner@localhost:5432/prumo?sslmode=disable" down -all
          migrate -path db/migrations -database "postgres://prumo_owner@localhost:5432/prumo?sslmode=disable" up

      - name: Testes (com isolamento por usuário no banco)
        env:
          TEST_DATABASE_URL: postgres://prumo_app@localhost:5432/prumo?sslmode=disable
          TEST_AUTH_DATABASE_URL: postgres://prumo_auth@localhost:5432/prumo?sslmode=disable
        run: go test -race -count=1 ./...

      - name: Imagem Docker compila
        run: docker build -t prumo-api:ci .
